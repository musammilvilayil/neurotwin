name: NeuroTwin CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --prefix client
      - name: Check launcher scripts syntax
        run: node --check scripts/setup.mjs && node --check scripts/dev-all.mjs && node --check scripts/stop-all.mjs
      - run: npm run build --prefix client
  server:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --prefix server
      - run: npm test --prefix server
  ml:
    name: ML syntax and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/ml/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r services/ml/requirements.txt
      - run: python -m compileall -q services/ml
      - name: Run ML tests
        working-directory: services/ml
        run: python -m unittest discover -s tests -v
