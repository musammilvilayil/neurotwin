services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo-data:/data/db"]
  ml:
    build: ./services/ml
    ports: ["8001:8001"]
  server:
    build: ./server
    environment:
      MONGODB_URI: mongodb://mongo:27017/neurotwin
      ML_SERVICE_URL: http://ml:8001
      JWT_SECRET: change-me-before-deploying
    ports: ["5000:5000"]
    depends_on: [mongo, ml]
volumes:
  mongo-data:
