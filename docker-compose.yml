services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo-data:/data/db"]
  ml:
    build: ./services/ml
    environment:
      MODEL_ARTIFACT_DIR: /app/artifacts
    ports: ["8001:8001"]
    volumes: ["./services/ml/artifacts:/app/artifacts:ro"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  sleep:
    build:
      context: ./services/ml
      dockerfile: Dockerfile.sleep
    ports: ["8002:8002"]
  server:
    build: ./server
    environment:
      MONGODB_URI: mongodb://mongo:27017/neurotwin
      ML_SERVICE_URL: http://ml:8001
      SLEEP_SERVICE_URL: http://sleep:8002
      JWT_SECRET: change-me-before-deploying
    ports: ["5000:5000"]
    depends_on:
      mongo: {condition: service_started}
      ml: {condition: service_healthy}
volumes:
  mongo-data:
